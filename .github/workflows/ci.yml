name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:storage:node
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-ai-sidebar-build
          path: |
            .scaffold/build/*.xpi
            .scaffold/build/update.json
          if-no-files-found: error
